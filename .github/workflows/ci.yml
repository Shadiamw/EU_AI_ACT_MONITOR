name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://monitor_app:monitor_app@localhost:5432/monitor_test
      DATABASE_ADMIN_URL: postgresql+psycopg://monitor_owner:monitor_owner@localhost:5432/monitor_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Create the test roles
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/bootstrap_roles.sql
      - name: Static checks
        run: ruff check . && ruff format --check . && mypy
      - name: Tests
        run: pytest --junitxml=test-results.xml
      # Phase 4 Addendum 9.5: the integration-marked tests, the acceptance gate and the image
      # job's acceptance runner and demo run only on main, on phase4-integration and on pull
      # requests into main. The gate reads the flagged run's own JUnit file, because it counts
      # a skipped test as not passed.
      - name: Tests, including integration
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        run: pytest --run-integration --junitxml=test-results-integration.xml
      - name: Every acceptance criterion passed
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        run: python tools/check_acceptance.py test-results-integration.xml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the compose stack
        run: docker compose up -d --build --wait
      - name: Health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/healthz
      # Part 4 writes the HTTP acceptance runner (tests/acceptance) and tools/demo_phase4.py
      # (Phase 4 spec 4.8 and 12) and completes these two steps; until then they say so.
      - name: HTTP acceptance runner
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        run: |
          if [ -d tests/acceptance ]; then
            BASE_URL=http://127.0.0.1:8000 pytest tests/acceptance
          else
            echo "tests/acceptance does not exist yet (Phase 4 Part 4)"
          fi
      - name: Phase 4 demo
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        run: |
          if [ -f tools/demo_phase4.py ]; then
            BASE_URL=http://127.0.0.1:8000 python tools/demo_phase4.py
          else
            echo "tools/demo_phase4.py does not exist yet (Phase 4 Part 4)"
          fi
      - name: Stop
        if: always()
        run: docker compose down -v
