name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://monitor_app:monitor_app@localhost:5432/monitor_test
      DATABASE_ADMIN_URL: postgresql+psycopg://monitor_owner:monitor_owner@localhost:5432/monitor_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Create the test roles
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/bootstrap_roles.sql
      - name: Static checks
        run: ruff check . && ruff format --check . && mypy
      # tests/acceptance is the HTTP runner. It runs against a live stack in the image job and
      # must not run in-process, where tests/conftest.py rebuilds the database (decision 145).
      - name: Tests
        run: pytest --ignore=tests/acceptance --junitxml=test-results.xml
      # Phase 4 Addendum 9.5: the integration-marked tests, the acceptance gate and the image
      # job's acceptance runner, Model 5 runner and demo run only on main, on phase4-integration
      # and on pull requests into main. The gate reads the flagged run's own JUnit file, because
      # it counts a skipped test as not passed.
      - name: Tests, including integration
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        run: pytest --run-integration --ignore=tests/acceptance --junitxml=test-results-integration.xml
      - name: Every acceptance criterion passed
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        run: python tools/check_acceptance.py test-results-integration.xml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner, the Model 5 runner and the demo run on the CI host against the stack.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Build and start the compose stack (with the webhook sink)
        run: docker compose up -d --build --wait
      - name: Health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/healthz
      # The API posts to the sink by its compose hostname; the runner reads the same channel
      # through the published port (Phase 4 spec 4.8 and 4.9).
      - name: HTTP acceptance runner
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        env:
          BASE_URL: http://127.0.0.1:8000
          WEBHOOK_SINK_URL: http://sink:8765/hook/ci
          WEBHOOK_SINK_READ_URL: http://127.0.0.1:8765/hook/ci
        run: pytest tests/acceptance --confcutdir=tests/acceptance -p no:cacheprovider --junitxml=acceptance.xml
      - name: Model 5 examples
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        env:
          BASE_URL: http://127.0.0.1:8000
          WEBHOOK_SINK_URL: http://sink:8765/hook/model5
          WEBHOOK_SINK_READ_URL: http://127.0.0.1:8765/hook/model5
        run: python tools/run_model5.py
      - name: Phase 4 demo
        if: github.ref_name == 'main' || github.ref_name == 'phase4-integration' || github.base_ref == 'main'
        env:
          BASE_URL: http://127.0.0.1:8000
          WEBHOOK_SINK_URL: http://sink:8765/hook/demo
          WEBHOOK_SINK_READ_URL: http://127.0.0.1:8765/hook/demo
        run: python tools/demo_phase4.py
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true
      - name: Upload the runner results and the stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-job
          path: |
            acceptance.xml
            compose.log
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: docker compose down -v
