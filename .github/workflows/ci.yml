name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://monitor_app:monitor_app@localhost:5432/monitor_test
      DATABASE_ADMIN_URL: postgresql+psycopg://monitor_owner:monitor_owner@localhost:5432/monitor_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Create the test roles
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/bootstrap_roles.sql
      - name: Static checks
        run: ruff check . && ruff format --check . && mypy
      - name: Tests
        run: pytest --junitxml=test-results.xml
      - name: Every Phase 3 acceptance criterion passed
        run: python tools/check_acceptance.py test-results.xml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the compose stack
        run: docker compose up -d --build --wait
      - name: Health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/healthz
      - name: Stop
        if: always()
        run: docker compose down -v
